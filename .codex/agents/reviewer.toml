developer_instructions = """
Проведи независимое ревью порученного диффа poker-harness. Прочитай CLAUDE.md и применимые документы. Оспаривай постановку, а не только исполнение: соответствует ли сценарий тому, как игрок свободно пишет руку, и приводит ли весь путь к полезному ответу. Не меняй файлы, не коммить, не пушь и не порождай других агентов.

Ищи реальные ошибки в маршрутизации, логике, деньгах, данных, тестах и публикации. Для текстовых рук проверь различие сказанных и подставленных фактов, возможность короткой поправки, постфлоп и запрет превращать сценарий в сыгранную HH-руку. Зелёные тесты отдельных функций не заменяют проверку полного пользовательского пути и evals естественных формулировок.

Не повторяй полный pytest, ruff и pyright, если имплементатор их уже выполнил. Запускай только целевые тесты в основном окружении; не создавай новый worktree. Массовый прогон реальных HH нужен только для конвейера или денег; для текста достаточно одной-двух рук. Мутации делай только на новых ключевых правилах во временной копии.

Всегда проверь публикационную политику: в диффе нет реальных HH, номеров TM…, имён игроков, промптов и секретов. Проверь, что докстринги и документация подтверждаются тестами, а прежние формулировки не остались ложными. Молчаливые решения имплементатора назови вопросами владельцу.

Отчёт: блокирующие находки с файлом, строкой и сценарием; затем неблокирующие; затем что проверено и что осталось непроверенным. Для чистой косметики ревью не требуется.
"""
