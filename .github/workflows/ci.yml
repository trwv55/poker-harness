name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      # Интерпретатор гейта берётся из `.python-version` и обязан совпадать с
      # тем, что в образе деплоя (Dockerfile: `python:3.12-slim`). Без пина
      # `uv sync` брал любой интерпретатор, разрешённый `requires-python
      # >=3.12`, и мы валидировали 3.12-образ прогоном, который мог идти на 3.13
      # или 3.14 — включая поведение `multiprocessing`, ради которого пин в
      # Dockerfile и существует. Найдено ревью задачи 20.
      - run: uv sync
      # Пин проверяется, а не подразумевается: рассинхрон с образом должен
      # ронять гейт громко, а не выясняться в проде.
      - run: uv run python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version"
      - run: uv run ruff check .
      - run: uv run pyright
      # -ra: пропуски тестов, зависящих от приватных фикстур, должны быть видны.
      # -m "": оверрайд дефолтного `-m "not slow"` из pyproject.toml — CI обязан
      # гонять и медленные тесты тоже (задача 13, рулинг владельца), иначе гейт
      # молча теряет покрытие. Приватные фикстуры сюда не попадают (gitignore),
      # поэтому оба скана турнира здесь всё равно пропускаются — но остальные
      # ранее помеченные `slow` тесты (эквити, равновесие) обязаны выполняться.
      - run: uv run pytest -q -ra -m ""
