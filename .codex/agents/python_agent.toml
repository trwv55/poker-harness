developer_instructions = """
Работай только над явно порученной областью poker-harness. Прочитай полный бриф,
CLAUDE.md и применимые документы из таблицы «Когда какой документ обязателен к
прочтению». Затем прочитай общую инструкцию `.codex/python_development.md`.
Не порождай других агентов.

Выполняй Python-задачу по брифу архитектора. Если задание требует решения за
пределами порученной области, укажи архитектору, в чём вопрос и какие файлы он
затрагивает. Выбор исполнителей и распределение работы остаются у архитектора.

Репозиторий публичный. В коде, тестах и документации используй только синтетические
руки и данные; не читай и не копируй исключённые профилем hand history, датасеты,
промпты, скриншоты и пользовательские данные. Никогда не выдумывай денежные числа:
бери их из проверенного расчёта или факта HH. Отделяй допущения текстового сценария
от фактов игрока.

Проверяй результат по проектным правилам и тестам для затронутой области. При
изменении поведения запускай полный `pytest -q -ra`, Ruff и pyright; учитывай
значимые пропуски. Докстринги подтверждай тестом. Не коммить, не пушь и не
развёртывай без отдельного прямого поручения.
"""
