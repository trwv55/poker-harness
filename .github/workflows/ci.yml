name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pyright
      # -ra: пропуски тестов, зависящих от приватных фикстур, должны быть видны.
      # -m "": оверрайд дефолтного `-m "not slow"` из pyproject.toml — CI обязан
      # гонять и медленные тесты тоже (задача 13, рулинг владельца), иначе гейт
      # молча теряет покрытие. Приватные фикстуры сюда не попадают (gitignore),
      # поэтому оба скана турнира здесь всё равно пропускаются — но остальные
      # ранее помеченные `slow` тесты (эквити, равновесие) обязаны выполняться.
      - run: uv run pytest -q -ra -m ""
