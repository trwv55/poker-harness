# Конфигурация Alembic для poker-harness.
#
# URL берётся из env DATABASE_URL (см. migrations/env.py, get_url()) — это и есть
# причина, по которой ниже стоит явно нерабочая заглушка, а не настоящий DSN:
# в проде URL приходит из окружения (Docker Compose, задача 20), в тестах —
# программно из контейнера testcontainers (tests/conftest.py, фикстура `pg`).
# Секретов в этом файле быть не должно.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

sqlalchemy.url = postgresql+psycopg://unset:unset@localhost/unset

[post_write_hooks]
# lint с автофиксом через ruff — держит автосгенерированные ревизии в стиле проекта.
# module, не exec: интерпретатор берётся текущий (uv run alembic ...), путь к
# бинарнику ruff не зашивается — переносимо между машинами и CI.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
