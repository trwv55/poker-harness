[project]
name = "poker-harness"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "eval7>=0.1.11",
    # Точный пин, а не диапазон: реплей опирается на внутреннее состояние
    # PokerKit (`State.statuses`), и патч-релиз может увести его из-под нас.
    "pokerkit==0.7.5",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
strict = ["src/harness/contracts"]
